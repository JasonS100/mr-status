name: TDP external heartbeat watchdog
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tdp-external-watchdog
  cancel-in-progress: false
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout monitor
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test failure handling
        run: python3 monitoring/heartbeat_watchdog.py --self-test
      - name: Probe public timestamps from outside the droplet
        run: python3 monitoring/heartbeat_watchdog.py
